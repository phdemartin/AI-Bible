name: Build Linux & Windows Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: "Linux (AppImage & .deb sur Ubuntu LTS)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6, SWORD & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libsword-dev \
            qt6-base-dev qt6-svg-dev libqt6svg6 \
            squashfs-tools patchelf curl file dpkg-dev

      - name: Build Linux Binary
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Package .deb and .AppImage
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh

      - name: Upload Linux Packages (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Bible-Linux-x86_64
          path: |
            dist/AI_Bible-*.AppImage
            dist/ai-bible_*.deb

  build-windows:
    name: "Windows 64-bit (AI_Bible.exe + DLLs)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Windows x64 Portable Zip (MinGW-w64)
        run: |
          chmod +x scripts/package_windows.sh
          ./scripts/package_windows.sh

      - name: Upload Windows Package (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Bible-Windows-x64
          path: dist/AI_Bible-*-Windows-x64.zip

  publish-release:
    name: "Publier sur GitHub Releases"
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Built Packages
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release & Attach Installers
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/AI_Bible-*.AppImage
            release_assets/ai-bible_*.deb
            release_assets/AI_Bible-*-Windows-x64.zip
